name: Terraform

on:
  push:
    branches: ["main"]

env:
  environment: ENV-Terraform
  TF_VAR_tenancy_ocid: ${{ secrets.TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.API_FINGERPRINT }}
  TF_VAR_private_key: ${{ secrets.PRIVATE_KEY }}
  TF_VAR_region: ${{ secrets.REGION }}
  TF_VAR_allowed_ip: ${{ secrets.ALLOWED_IP }}

jobs:
  plan:
    environment: ENV-Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Terraform

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TERRAFORM_API_TOKEN }}
          terraform_version: "1.15.8"

      - name: Terraform Init
        run: terraform init
        env: 
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color

      - name: Show Plan Output
        if: always()
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_STDERR: ${{ steps.plan.outputs.stderr }}
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          echo "## Summary"
          echo "Exit Code: $PLAN_EXITCODE" >> $GITHUB_STEP_SUMMARY
          echo "=== STDOUT ===" >> $GITHUB_STEP_SUMMARY
          echo "$PLAN_STDOUT" >> $GITHUB_STEP_SUMMARY
          echo "=== STDERR ===" >> $GITHUB_STEP_SUMMARY
          echo "$PLAN_STDERR" >> $GITHUB_STEP_SUMMARY
